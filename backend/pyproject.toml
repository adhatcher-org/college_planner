[project]
name = "college-planner-backend"
version = "0.1.0"
description = "Backend API for College Planner"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "email-validator>=2.2.0",
    "fastapi!=0.136.3,>=0.141.1",
    "httpx>=0.28.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
